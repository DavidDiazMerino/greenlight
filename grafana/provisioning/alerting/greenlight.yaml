apiVersion: 1

groups:
  - orgId: 1
    name: greenlight-release-gates
    folder: Greenlight
    interval: 10s
    rules:
      - uid: greenlight-caption-safe-area
        title: Greenlight caption safe-area violation
        condition: C
        data:
          - refId: A
            datasourceUid: grafanacloud-prom
            relativeTimeRange:
              from: 120
              to: 0
            model:
              datasource:
                type: prometheus
                uid: grafanacloud-prom
              editorMode: code
              expr: max(greenlight_caption_safe_area_violation_px{variant="candidate"})
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        dashboardUid: greenlight-release-gate
        panelId: 2
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          description: Candidate caption pixels exceed the committed 9:16 safe area. The deterministic Greenlight policy must hold the release.
          runbook_url: https://github.com/DavidDiazMerino/greenlight/blob/main/docs/grafana-workflow.md
          summary: Greenlight measured a caption safe-area violation.
        labels:
          component: caption-compositor
          gate: caption-safe-area-9x16
          owner: deterministic-policy-evaluator
          severity: critical
        isPaused: false
